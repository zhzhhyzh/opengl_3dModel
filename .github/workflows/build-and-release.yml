name: Build and Release OpenGL Poseidon

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Build solution
        run: msbuild asg.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /m

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: OpenGL-Poseidon-${{ matrix.platform }}-${{ matrix.configuration }}
          path: |
            x64/${{ matrix.configuration }}/*.exe
            asg/*.bmp
            asg/*.mp3
            asg/*.obj
            asg/*.mtl
            asg/*.jpg
            asg/*.glb

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: OpenGL-Poseidon-x64-Release
          path: release-files

      - name: Create ZIP package
        run: Compress-Archive -Path release-files\* -DestinationPath OpenGL-Poseidon-Release.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: OpenGL-Poseidon-Release.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
